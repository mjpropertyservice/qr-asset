<!DOCTYPE html>
<html lang="th">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบ QR ทะเบียนทรัพย์สิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
/* MJ brand: เขียวเข้มของตัว M, เขียวอ่อนของเส้น J, ส้มของหลังคา */
:root{
  --mj-forest:#173D1C; --mj-forest-2:#22562A; --mj-leaf:#86BD41; --mj-leaf-2:#A9D46F; --mj-roof:#F38720; --mj-roof-2:#E2621B; --mj-sky:#2E86DE;
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#F8FAF6; --line:#E0E8DA; --line-2:#CBD8C2;
  --ink:#16241A; --muted:#5F6E63; --faint:#8A978D;
  --green-9:var(--mj-forest); --green-7:#2C6B33; --green-5:var(--mj-leaf); --green-1:#EDF5E4; --green-0:var(--bg);
  --orange:var(--mj-roof-2); --red:#C0392B; --card:var(--surface);
  --warn-bg:#FFF3E3; --warn:#A04A0C; --err-bg:#FDECEA; --ok-bg:#E9F5DE;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(23,61,28,.06),0 6px 20px rgba(23,61,28,.06);
  --shadow-lg:0 2px 6px rgba(23,61,28,.08),0 18px 40px rgba(23,61,28,.12);
  --f-head:'Prompt','Sarabun',Tahoma,sans-serif; --f-body:'Sarabun',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-7)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--green-1);padding:1px 6px;border-radius:6px;color:var(--mj-forest)}
:focus-visible{outline:3px solid rgba(134,189,65,.55);outline-offset:2px}

/* ---------- header ---------- */
/* ---------- layout: sidebar + topbar ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#173D1C 0%,#12321A 70%,#0F2B16 100%);color:#DCEBD3;display:flex;flex-direction:column;padding:18px 14px;z-index:40;scrollbar-width:thin}
.side::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--mj-forest),var(--mj-leaf) 45%,var(--mj-roof))}
.side-brand{display:flex;flex-direction:column;gap:12px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.logo-card{background:#fff;border-radius:14px;padding:10px 12px;display:flex;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo-card img{height:42px;width:auto;display:block}
.sb-tt b{display:block;font-family:var(--f-head);font-weight:600;font-size:16px;color:#fff;line-height:1.25}
.sb-tt span{font-size:12px;color:#A9C79A;letter-spacing:.3px}
.side-label{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#86A97A;font-weight:700;padding:0 10px 8px}
nav.tabs{display:flex;flex-direction:column;gap:3px}
nav.tabs button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#CFE2C4;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500;font-family:var(--f-head);font-size:14.5px;transition:background .15s,color .15s,transform .1s}
nav.tabs button svg{width:20px;height:20px;flex:none;opacity:.9}
nav.tabs button:hover{background:rgba(255,255,255,.07);color:#fff}
nav.tabs button.on{background:#fff;color:var(--mj-forest);font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.18)}
nav.tabs button.on svg{color:var(--mj-roof);opacity:1}
nav.tabs button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--mj-leaf)}
.side-foot{margin-top:auto;padding:16px 10px 4px;font-size:11.5px;color:#7E9E73;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:#CFE2C4;font-weight:600}
.shell{min-width:0;display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(243,246,241,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hamb{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;align-items:center;justify-content:center;color:var(--mj-forest)}
.hamb svg{width:22px;height:22px}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl .crumb{font-size:12px;color:var(--faint);letter-spacing:.2px}
.ttl h1{margin:0;font-family:var(--f-head);font-weight:600;font-size:22px;color:var(--mj-forest);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.unitbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 12px;box-shadow:var(--shadow)}
.unitbox label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.top select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:250px;max-width:100%;font-weight:600}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:600;box-shadow:var(--shadow)}
.me:hover{border-color:var(--mj-leaf)}
.me .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mj-forest),var(--mj-leaf));color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-head)}
.me .em{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.locked .app{visibility:hidden}
main{width:100%;max-width:1320px;margin:0 auto;padding:24px 28px 90px;animation:fadeUp .25s ease both}
main > h2:first-child{display:none}
@keyframes fadeUp{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.side-scrim{display:none}

h2{font-family:var(--f-head);font-weight:600;font-size:24px;margin:2px 0 4px;color:var(--mj-forest);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-family:var(--f-head);font-weight:600;font-size:17px;color:var(--mj-forest)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px;min-width:0;transition:border-color .15s,box-shadow .15s}
label.f input:focus,label.f select:focus,label.f textarea:focus,td input:focus,td textarea:focus{outline:0;border-color:var(--mj-leaf);box-shadow:0 0 0 4px rgba(134,189,65,.18)}
label.f input[disabled],label.f input[readonly]{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--mj-forest);background:var(--mj-forest);color:#fff;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;font-weight:600;font-family:var(--f-head);font-size:14px;text-decoration:none;white-space:nowrap;transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{background:var(--mj-forest-2);box-shadow:0 6px 16px rgba(23,61,28,.22)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--mj-forest);border-color:var(--line-2)}
.btn.sec:hover{background:var(--green-1);border-color:var(--mj-leaf);box-shadow:none}
.btn.warn,.btn.accent{background:linear-gradient(135deg,var(--mj-roof),var(--mj-roof-2));border-color:var(--mj-roof-2)}
.btn.warn:hover,.btn.accent:hover{box-shadow:0 6px 16px rgba(226,98,27,.3)}
.btn.danger{background:var(--surface);color:var(--red);border-color:#e9b8b2}
.btn.danger:hover{background:var(--err-bg);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:#2C6B33}
.pill.new{background:#E5F0FB;color:#1C5FA8}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--red)}
.pill.gray{background:#EEF1EC;color:#5B665E}

/* ---------- tables ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:70vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid #EDF2E9;text-align:left;vertical-align:middle}
tbody tr:hover td{background:#F7FBF2}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:#F2F7EC;color:var(--mj-forest);z-index:1;font-weight:700;white-space:nowrap;font-family:var(--f-head);font-size:13px;letter-spacing:.2px}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F6FAF1}
tr.skip td{opacity:.5}
td input[type=text],td input:not([type]){width:100%;min-width:90px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
td input.wide{min-width:220px}
td input.num{width:70px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
td.thumb img,.thumb img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#EEF2EC;display:block}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;margin-bottom:18px;color:#fff;background:linear-gradient(120deg,var(--mj-forest) 0%,#1F5A27 55%,#2C6B33 100%);box-shadow:var(--shadow-lg)}
.hero::before,.hero::after{content:"";position:absolute;top:-30%;bottom:-30%;width:16px;border-radius:8px;background:var(--mj-leaf);opacity:.18;transform:rotate(18deg)}
.hero::before{right:120px;box-shadow:28px 0 0 var(--mj-leaf),56px 0 0 var(--mj-leaf),84px 0 0 var(--mj-leaf)}
.hero::after{right:-6px;background:var(--mj-roof);opacity:.25}
.hero .eyebrow{font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mj-leaf-2);font-weight:700}
.hero h2{color:#fff;font-size:26px;margin:6px 0 6px}
.hero p{margin:0;color:#DCEBD3;max-width:62ch;position:relative}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 18px}
.qa button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s,border-color .15s}
.qa button:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--mj-leaf)}
.qa .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--green-1);color:var(--mj-forest)}
.qa .ic.or{background:#FFF0E2;color:var(--mj-roof-2)}
.qa .ic svg{width:24px;height:24px}
.qa b{display:block;font-family:var(--f-head);font-weight:600;color:var(--ink);font-size:15px}
.qa span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13.5px;transition:transform .12s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .si{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--green-1);color:var(--mj-forest)}
.stat .si.or{background:#FFF0E2;color:var(--mj-roof-2)}
.stat .si.sky{background:#E7F1FB;color:#1C5FA8}
.stat .si svg{width:24px;height:24px}
.stat b{display:block;font-family:var(--f-head);font-size:28px;font-weight:600;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:17px;color:var(--mj-forest)}
.bars{display:flex;flex-direction:column;gap:13px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"l l" "t p";column-gap:10px;row-gap:5px;align-items:center}
.bar .bl{grid-area:l;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .bl b{font-variant-numeric:tabular-nums;font-weight:600}
.bar .bl i{font-style:normal;color:var(--faint);font-weight:400}
.track{grid-area:t;height:9px;border-radius:99px;background:#EDF2E9;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.fill.hi{background:linear-gradient(90deg,var(--mj-forest-2),var(--mj-leaf))}
.fill.mid{background:linear-gradient(90deg,var(--mj-leaf),#C8D94A)}
.fill.lo{background:linear-gradient(90deg,var(--mj-roof),var(--mj-roof-2))}
.bar .pc{grid-area:p;text-align:right;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.recent li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.recent .rt{width:44px;height:44px;border-radius:11px;overflow:hidden;flex:none;background:var(--green-1);display:grid;place-items:center;color:var(--mj-forest)}
.recent .rt img{width:100%;height:100%;object-fit:cover;display:block}
.recent .rt svg{width:20px;height:20px}
.recent .rm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.recent .rm b{font-size:14.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rm>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rd{font-size:12px;color:var(--faint);white-space:nowrap}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sect h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:18px;color:var(--mj-forest)}
.unitcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s}
.ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ucard.sel{outline:2px solid var(--mj-leaf);outline-offset:-2px}
.ucard .hd{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px}
.ucard .hd b{font-family:var(--f-head);font-size:20px;letter-spacing:.5px}
.ucard .bd{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
.ucard .bd strong{color:var(--ink);font-size:16px;font-family:var(--f-head);font-variant-numeric:tabular-nums}

.note{background:var(--warn-bg);border:1px solid #F6D2A6;color:#6B3A10;border-radius:12px;padding:11px 14px;font-size:14px}
.note.info{background:#EEF5FC;border-color:#CFE0F1;color:#1F3D63}
.note.ok{background:var(--ok-bg);border-color:#C6E2B5;color:#1D4D1F}
.empty{padding:30px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mj-forest);color:#fff;padding:11px 20px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:100;display:none;max-width:92vw;border-left:5px solid var(--mj-leaf)}
#toast.err{background:#7E241B;border-left-color:var(--mj-roof)}
#busy{position:fixed;inset:0;background:rgba(243,246,241,.78);backdrop-filter:blur(2px);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--mj-forest);font-family:var(--f-head)}
.spin{width:44px;height:44px;border:4px solid #D7E8C5;border-top-color:var(--mj-forest);border-right-color:var(--mj-roof);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.qa button,.ucard,.btn{transition:none}}
dialog{border:0;border-radius:18px;padding:0;max-width:780px;width:94vw;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(16,36,20,.5);backdrop-filter:blur(2px)}
dialog .dh{padding:16px 20px;background:linear-gradient(90deg,var(--mj-forest),#24592C);display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff}
dialog .dh h3{margin:0;color:#fff;font-family:var(--f-head);font-weight:600}
dialog .db{padding:18px 20px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2)}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:#fff;opacity:.85}
.preview-photo{width:100%;max-height:270px;object-fit:contain;background:#EEF2EC;border-radius:12px}
.mock{border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:360px;background:#fff;box-shadow:var(--shadow)}
.mock .mh{padding:8px 10px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:3px solid}
.mock .mh .lg{width:78px;height:25px;background:#fff;border-radius:4px;display:grid;place-items:center;overflow:hidden}
.mock .mh .lg img{max-width:70px;max-height:20px}
.mock .mh .tt{text-align:center;font-size:12px;line-height:1.2}
.mock .mr{display:grid;grid-template-columns:38% 62%;font-size:12px}
.mock .mr div{padding:5px 8px}
.mock .mr .k{color:#fff;font-weight:700}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.colors input[type=color]{width:42px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:#fff}
.logobox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logobox .lg{width:156px;height:50px;border:1px dashed var(--line-2);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logobox .lg img{max-width:140px;max-height:38px}
#qrPreview{max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--warn);margin-top:4px}
/* ---------- login ---------- */
